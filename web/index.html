<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web3Tube</title>
<meta name="description" content="The crypto videos builders and researchers keep recommending, with the evidence for each one.">
<meta property="og:title" content="Web3Tube">
<meta property="og:description" content="The crypto videos builders and researchers keep recommending, with the evidence for each one.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://web3tube.pages.dev/">
<meta property="og:image" content="https://web3tube.pages.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4a3aff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="home">
    <img class="logo" src="favicon.svg" width="28" height="28" alt="">
    <span><b>Web3Tube</b><small>The videos builders keep recommending.</small></span>
  </a>
  <input id="q" type="search" placeholder="Search ZK proofs, MEV, L2s, security…" autocomplete="off" aria-label="Search">
  <nav class="links"><a href="how-it-works.html">How it works</a><a href="#saved">Saved</a></nav>
</header>

<div class="bar">
  <div id="chips" class="chips" role="tablist"></div>
  <div class="toggles">
    <label><input type="checkbox" id="longs"> Longs (40 min+)</label>
    <label><input type="checkbox" id="hideOutdated" checked> Hide outdated</label>
    <select id="sort" aria-label="Sort">
      <option value="score">Best evidence</option>
      <option value="voices">Most voices</option>
      <option value="recent">Recently endorsed</option>
      <option value="new">Newest video</option>
    </select>
  </div>
</div>

<main id="main"></main>

<dialog id="player" aria-label="Video">
  <div class="pl">
    <button class="close" id="closePlayer" aria-label="Close">✕</button>
    <div class="embed"><iframe id="frame" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="pl-body">
      <div class="pl-main">
        <h2 id="plTitle"></h2>
        <p class="meta" id="plMeta"></p>
        <p id="plSum" class="sum"></p>
        <div id="plFlags" class="flags"></div>
        <div class="actions">
          <button id="saveBtn" class="btn"></button>
          <button id="watchedBtn" class="btn"></button>
          <a id="ytLink" class="btn ghost" target="_blank" rel="noopener">Open on YouTube</a>
        </div>
        <h3>Why it's recommended</h3>
        <p id="whyLine" class="why-line"></p>
        <ol id="evidence" class="evidence"></ol>
      </div>
      <aside class="pl-side">
        <h3>Score breakdown</h3>
        <div id="signals"></div>
        <h3>Related</h3>
        <div id="related" class="related"></div>
      </aside>
    </div>
  </div>
</dialog>

<footer class="foot" id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
